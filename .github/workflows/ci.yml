name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: 前端与 Zig 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行完整检查
        run: pnpm run check
